<!DOCTYPE html>
<html lang="fi">
<link rel="stylesheet" href="css/css.css">

<head>
    <meta charset="UTF-8">
    <title>Toinen tehtävä</title>
    <style>
        .contact-info {
            display: grid;
            grid-template-columns: 200px 200px;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: darkgray;
            color: chocolate;
            font-family: Arial, sans-serif;
        }

        fieldset {
            margin: 0;
            margin-bottom: -12px;
            box-sizing: border-box;
            width: 450px;
            background-color: white;
        }

        fieldset:first-of-type {
            margin-top: 20px;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>

<body>


    <form>
        <fieldset>
            <legend><b>Yhteysottotiedot</b></legend>
            <div class="contact-info">
                <div>
                    <label for="fname">Etunimi:</label><br><input type="text" id="fname" name="fname"><br><br>
                    <label for="lname">Sukunimi:</label><br><input type="text" id="lname" name="lname"><br><br>
                    <label for="sposti">Sähköposti:</label><br><input type="email" id="sposti" name="tEmail"><br><br>
                    <label for="tphone">Puhelin:</label><input type="tel" id="tphone" name="tPhone">
                </div>
                <div>
                    <p>Yhteydenottotapa:</p><input type="checkbox" id="email1" name="contact[]" value="Email">
                    <label for="email1">Email</label><br>
                    <input type="checkbox" id="phone1" name="contact[]" value="Telephone">
                    <label for="phone1">Telephone</label>
                </div>
            </div>
        </fieldset>
        <fieldset>
            <legend><b>Palaute</b></legend><label for="subject">Aihe:</label><br>
            <input type="text" id="subject" name="subject"><br><br><label for="text">Viesti:</label><br>
            <textarea id="text" name="message" rows="6" cols="50"></textarea><br><br>
            <label for="file">Liitetiedosto:</label><br>
            <input type="file" id="file" name="file"><br><br>
            <button type="submit">Lähetä</button>
        </fieldset>
    </form>
</body>

</html>
